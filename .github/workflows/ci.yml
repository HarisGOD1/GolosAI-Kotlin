name: Continuous Integration

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-15 ]

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run Detekt & Ktlint Style Checks
        if: runner.os == 'Linux'
        run: ./gradlew detektAll ktlintAll --no-daemon

      - name: Run All Tests Across Modules
        shell: bash
        run: ./gradlew testAll --no-daemon

      - name: Assemble & Verify Reproducible Build Artifacts
        shell: bash
        run: ./gradlew assemble build packageAllDistributions -x test --no-daemon

      - name: Upload JaCoCo Coverage Report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/jacocoRootReport/html/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
